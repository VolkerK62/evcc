template: daheimladen-pro
products:
  - { brand: DaheimLaden, description: { generic: Smart/Touch Pro } }
  - { brand: DaheimLaden, description: { generic: Business } }
requirements:
  description:
    de: Firmware-Anforderungen= Smart/Touch Pro ab "M3W_3.11STP", Business ab "M3W_4.03PTB". Während der Phasen-Umschaltung pausiert die Ladung standardmäßig für zwei Minuten. Mit dem optionalen Parameter "Phasenumschaltpause" kann die Pause auf 30-120 Sekunden eingestellt werden (erfordert Firmware ab 4.08STP für Smart/Touch PRO bzw. ab 4.07PTB für Business). Informationen zur Ladefreigabe (AutoStart, App, RFID, Button), bitte der Wallbox Dokumentation von DaheimLaden entnehmen.
    en: Firmware requirements= Smart/Touch Pro from "M3W_3.11STP", Business from "M3W_4.03PTB". Charging pauses for two minutes by default during phase switching. The optional "Phase switching pause" parameter can be set to 30-120 seconds (requires firmware from 4.08STP for Smart/Touch PRO and from 4.07PTB for Business). For information regarding charging authorization (AutoStart, App, RFID, Button), please refer to the DaheimLaden wallbox documentation.
capabilities: ["mA", "rfid", "1p3p", "meter", "dim"]
params:
  - name: host
  - name: port
    default: 502
  - name: phaseSwitchPause
    type: int
    advanced: true
    description:
      de: Phasenumschaltpause
      en: Phase switching pause
    help:
      de: Pause bei der Phasenumschaltung in Sekunden (30-120, andere Werte werden begrenzt). Leer lassen für den Firmware-Standard (120 s).
      en: Pause during phase switching in seconds (30-120, other values will be limited). Leave empty to use the firmware default (120 s).
    example: 60
render: |
  type: daheimladen
  uri: {{ joinHostPort .host .port }}
  phases1p3p: true
  {{- if .phaseSwitchPause }}
  phaseSwitchPause: {{ .phaseSwitchPause }}
  {{- end }}
